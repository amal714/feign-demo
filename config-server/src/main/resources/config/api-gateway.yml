server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: main-service-route
          uri: lb://MAIN-SERVICE # The lb:// tells the Gateway to use the Load Balancer to find MAIN-SERVICE in Eureka.
          predicates:
            - Path=/api/main/**
          filters:
            - StripPrefix=2 # This removes the /api/main prefix before forwarding the request to MAIN-SERVICE.


